# FileShare-P2P Peer example configuration
#
# Local configuration priority:
#   1. OS environment variables
#   2. .env
#   3. application.properties
#   4. built-in defaults
#
# Recommended for local development:
#   copy .env.example .env
#
# Never commit real passwords.

# =========================
# Tracker Connection
# =========================
tracker.host=127.0.0.1
tracker.port=9000

# =========================
# Tracker TLS
# =========================
tracker.tls.enabled=false
tracker.tls.truststore.path=certs/peer-truststore.p12
tracker.tls.truststore.password=CHANGE_ME
tracker.tls.truststore.type=PKCS12
