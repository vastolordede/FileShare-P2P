# FileShare-P2P Tracker example configuration
#
# Local configuration priority:
#   1. OS environment variables
#   2. .env
#   3. application.properties
#   4. built-in defaults
#
# Recommended: copy .env.example to .env for local development.
# Never commit real passwords.

# =========================
# Database
# =========================
db.url=jdbc:postgresql://localhost:5432/fileshare_p2p
db.username=postgres
db.password=CHANGE_ME

# =========================
# Tracker Server
# =========================
tracker.port=9000

# =========================
# Heartbeat
# =========================
heartbeat.interval.seconds=10
heartbeat.timeout.seconds=30

# =========================
# Statistics Monitor
# =========================
statistics.interval.seconds=30